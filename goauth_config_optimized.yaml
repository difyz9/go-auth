# Go-Auth 配置示例

# 应用配置
apps:
  # 示例1：普通应用
  test-app-001:
    app_secret: "tmcf5m6qcm6k9hrp3sy8rhgafu00ttph"
    app_name: "测试应用"
    enabled: true
    require_sign: true
    ip_whitelist:
      - "*"
    rate_limit: 1000
    allowed_routes:
      - "/api/*"

  # 示例2：明确禁用签名验证的应用
  public-app-003:
    app_secret: "public-secret"
    app_name: "公开应用"
    enabled: true
    require_sign: false  # 不需要签名
    rate_limit: 5000

# 其他全局配置
timestamp_tolerance: 300  # 时间戳容差（秒）
default_rate_limit: 1000  # 默认速率限制
enable_ip_check: true     # 启用IP检查

# 加密配置（可选）
# crypto:
#   enabled: false
#   aes_key: "your-32-byte-aes-key-here!!!"
